services:
  app:
    container_name: node_app
    restart: always
    build: .
    ports:
      - '3000:3000'
    links:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/blog
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=b96120d0babd5b7a5613537fc70d3463
      - JWT_EXPIRES_IN=90d
    depends_on:
      - mongo
  mongo:
    container_name: mongo
    image: mongo
    restart: always
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: